# Moved from Karasu-Lab/karasu256.com/.github/workflows/admin-api-docker-publish.yml.
# This app depends on workspace packages, so the deploy still builds in
# the hub repository's tree: this workflow clones the hub (with its
# submodules) and pins this app's submodule to the commit that triggered
# the run. It requires the hub's main branch to carry the submodule
# layout, and this repository to hold the Actions secrets and variables
# referenced below under the same names.
name: Build & Push API Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: hashibutogarasu/karasu-lab-admin-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Assemble the workspace from the hub repository
        run: |
          git clone --recurse-submodules --branch main https://github.com/Karasu-Lab/karasu256.com.git .
          git -C apps/api.admin.karasu256.com fetch origin "${{ github.sha }}"
          git -C apps/api.admin.karasu256.com checkout --detach "${{ github.sha }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api.admin.karasu256.com/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
